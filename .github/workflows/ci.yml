name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/sereinflow-web/pnpm-lock.yaml

      - name: Restore .NET dependencies
        run: dotnet restore SereinFlow.sln --locked-mode

      - name: Build .NET solution
        run: dotnet build SereinFlow.sln --configuration Release --no-restore

      - name: Test .NET solution
        run: dotnet test SereinFlow.sln --configuration Release --no-build --no-restore

      - name: Restore frontend dependencies
        working-directory: frontend/sereinflow-web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend/sereinflow-web
        run: pnpm build
